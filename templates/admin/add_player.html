{% extends "base.html" %}

{% block content %}

<div class="container" style="margin-top:170px;">

    <h2 class="fw-bold mb-4">

        Add Player

    </h2>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input type="text" class="form-control" name="full_name" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Jersey Number

                    </label>

                    <input type="number" class="form-control" name="jersey_number" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Position

                    </label>

                    <select class="form-select" name="position">

                        <option>Goalkeeper</option>
                        <option>Right Back</option>
                        <option>Left Back</option>
                        <option>Center Back</option>
                        <option>Defensive Midfielder</option>
                        <option>Central Midfielder</option>
                        <option>Attacking Midfielder</option>
                        <option>Right Wing</option>
                        <option>Left Wing</option>
                        <option>Striker</option>

                    </select>

                </div>

                <div class="mb-4">
                
                    <label class="form-label">
                
                        Team
                
                    </label>
                
                    <select class="form-select" name="team_id">
                    
                        {% for team in teams %}
                    
                        <option value="{{ team.id }}">
                    
                            {{ team.name }}
                    
                        </option>
                    
                        {% endfor %}
                    
                    </select>

                <div class="mb-4">
                
                    <label class="form-label">
                
                        Status
                
                    </label>
                
                    <select class="form-select" name="status">
                
                        <option value="Available">
                
                            Available
                
                        </option>
                
                        <option value="Injured">
                
                            Injured
                
                        </option>
                
                        <option value="Suspended">
                
                            Suspended
                
                        </option>
                
                    </select>
                
                </div>

                </div>

                <button class="btn btn-success">

                    Save Player

                </button>

            <form method="POST">

        </div>

    </div>

</div>

{% endblock %}
