{% extends "base.html" %}

{% block content %}

<div class="container" style="margin-top:150px;">

    <div class="mb-3">
    
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">
    
            <i class="bi bi-arrow-left"></i>
            Dashboard
    
        </a>
    
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold">
            Manage Teams
        </h2>

        <a
            href="{{ url_for('add_team') }}"
            class="btn btn-primary">

            + Add Team

        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>Department</th>

                        <th>Captain</th>

                        <th>Manager</th>

                        <th>Players</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    {% for team in teams %}
                    
                    <tr>
                    
                        <td>{{ team.name }}</td>
                    
                        <td>{{ team.captain }}</td>
                    
                        <td>{{ team.manager }}</td>
                    
                        <td>{{ team.players }}</td>
                    
                        <td>
                    
                            <a href="{{ url_for('edit_team', id=team.id) }}" class="btn btn-warning btn-sm">
                            
                                Edit
                            
                            </a>
                    
                            <form action="{{ url_for('delete_team', id=team.id) }}" method="POST" style="display:inline;">
                            
                                <button class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this team?')">
                            
                                    Delete
                            
                                </button>
                            
                            </form>
                    
                        </td>
                    
                    </tr>
                    
                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
