{% extends "base.html" %}

{% block content %}

<div class="container" style="margin-top:170px;">

    <div class="mb-3">

        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">

            ← Dashboard

        </a>

    </div>

    <h2 class="fw-bold mb-4">

        Add New Fixture

    </h2>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Home Team

                    </label>

                    <select class="form-select" name="home_team_id">

                        {% for team in teams %}

                        <option value="{{ team.id }}">

                            {{ team.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Away Team

                    </label>

                    <select class="form-select" name="away_team_id">

                        {% for team in teams %}

                        <option value="{{ team.id }}">

                            {{ team.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Match Date

                    </label>

                    <input type="date" class="form-control" name="match_date" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Kickoff Time

                    </label>

                    <input type="time" class="form-control" name="kickoff_time" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Venue

                    </label>

                    <input type="text" class="form-control" name="venue" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Stage

                    </label>

                    <select class="form-select" name="stage">

                        <option>Group Stage</option>

                        <option>Quarter Final</option>

                        <option>Semi Final</option>

                        <option>Third Place</option>

                        <option>Final</option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Group

                    </label>

                    <select class="form-select" name="group">

                        <option>A</option>

                        <option>B</option>

                        <option>C</option>

                        <option>D</option>

                    </select>

                </div>

                <button class="btn btn-success">

                    Save Fixture

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
