{% extends "base.html" %}

{% block content %}

<section class="admin-page">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <!-- Logo -->

                        <div class="text-center mb-4">

                            <h2 class="mt-3 fw-bold">

                                Admin Portal

                            </h2>

                            <p class="text-muted">

                                AFIT Final Year Football Tournament Management System

                            </p>

                        </div>

                        <!-- Login Form -->

                        <form method="POST">

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email

                                </label>

                                <input type="email" name="email" class="form-control form-control-lg" placeholder="admin@afit.edu.ng" required>

                            </div>

                            <!-- Password -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="input-group">

                                    <input type="password" name="password" id="password" class="form-control form-control-lg" placeholder="Password"
                                        required>

                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">

                                        <i class="bi bi-eye-fill"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Remember Me -->

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="remember">

                                    <label class="form-check-label" for="remember">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="#" class="forgot-link">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Login Button -->

                            <button class="btn btn-primary btn-lg w-100 login-btn">

                                <i class="bi bi-box-arrow-in-right me-2"></i>

                                Login

                            </button>

                        </form>

                        <!-- Footer -->

                        <div class="text-center mt-4">

                            <small class="text-muted">

                                Authorized Administrators Only

                            </small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

    const togglePassword = document.getElementById("togglePassword");

    const password = document.getElementById("password");

    togglePassword.addEventListener("click", function () {

        const type = password.type === "password" ? "text" : "password";

        password.type = type;

        const icon = this.querySelector("i");

        if (type === "text") {

            icon.classList.remove("bi-eye-fill");
            icon.classList.add("bi-eye-slash-fill");

        } else {

            icon.classList.remove("bi-eye-slash-fill");
            icon.classList.add("bi-eye-fill");

        }

    });

</script>

{% endblock %}
