<script>

const counters = document.querySelectorAll(".counter");

const counterObserver = new IntersectionObserver((entries, observer) => {

    entries.forEach(entry => {

        if(entry.isIntersecting){

            const counter = entry.target;

            const target = +counter.getAttribute("data-target");

            let current = 0;

            const increment = Math.ceil(target / 60);

            const updateCounter = () => {

                if(current < target){

                    current += increment;

                    if(current > target){

                        current = target;

                    }

                    counter.innerText = current;

                    setTimeout(updateCounter,20);

                }

                else{

                    if(target >= 320){

                        counter.innerText = target + "+";

                    }
                    else{

                        counter.innerText = target;

                    }

                }

            };

            updateCounter();

            observer.unobserve(counter);

        }

    });

},{
    threshold:0.5
});

counters.forEach(counter => {

    counterObserver.observe(counter);

});

</script>

<script>

const tournamentDate = new Date("October 9, 2026 16:00:00").getTime();

const timer = setInterval(function(){

    const now = new Date().getTime();

    const distance = tournamentDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));

    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    if (document.getElementById("days")) {

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

    const mini = document.getElementById("miniCountdown");

        if (mini) {

            mini.innerHTML =
                days + "d " +
                hours + "h " +
                minutes + "m";

        }

    }

},1000);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>

AOS.init({

    duration:900,

    once:true,

    easing:"ease-out-cubic"

});

</script>

<script>

    window.addEventListener("scroll", function () {

        const banner = document.querySelector(".countdown-banner");

        if (!banner) return;

        const hero = document.querySelector(".hero-section");

        if (!hero) return;

        if (window.scrollY > hero.offsetHeight - 120) {

            banner.classList.add("hide-countdown");

        } else {

            banner.classList.remove("hide-countdown");

        }

    });

</script>

<script>

    const links = document.querySelectorAll(".stats-link");
    const panels = document.querySelectorAll(".stats-panel");

    links.forEach(link => {

        link.addEventListener("click", () => {

            links.forEach(l => l.classList.remove("active"));
            panels.forEach(p => p.classList.remove("active"));

            link.classList.add("active");

            document
                .getElementById(link.dataset.target)
                .classList.add("active");

        });

    });

</script>
